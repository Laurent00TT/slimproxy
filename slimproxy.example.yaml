# slimproxy configuration.
#
# This is the entire knob set. Anything not here is pinned off by the proxy
# package -- run `slimproxy -check` to see what that resolves to.

# Listen address. Leave host empty to bind all interfaces.
host: "127.0.0.1"
port: 8317

# Keys inbound clients must present.
#
# Required. CLIProxyAPI's inbound auth is fail-open -- with no key configured
# every request is accepted, on a process holding live subscription
# credentials. Set allow-unauthenticated: true only if the port is genuinely
# unreachable from outside this host.
api-keys:
  - "change-me-to-something-random"
allow-unauthenticated: false

# Directory holding OAuth credential files, as written by
# "slimproxy auth add <provider>". Created if absent; the file watcher picks up
# new credentials without a restart.
auth-dir: "auths"

# Optional upstream proxy. A per-credential proxy-url in the credential file
# takes precedence over this.
proxy-url: ""

# Dial upstream directly whenever proxy-url's port has no listener (probed
# with a short loopback dial, verdict cached ~2s), deciding per connection.
# For machines that alternate between a system-proxy VPN (proxy required) and
# a TUN VPN (proxy port dead, direct traffic captured transparently): the
# switch is followed automatically, no restart needed. Path changes are
# journalled ("slimproxy log") and "slimproxy check" reports the path the
# probe would pick right now. Requires a loopback http:// proxy-url. Leave
# this off if your proxy is an egress policy rather than a reachability
# workaround -- with it on, a down proxy means traffic goes direct instead of
# failing.
proxy-fallback-direct: false

# Upstream retry behaviour.
#
# request-retry is NOT a failure-retry count. It caps how many times the outer
# loop waits for a cooling credential to recover (or honours a 429 retry-after)
# before giving up. Failures that never enter cooldown -- 529, dial errors --
# are attempted exactly once whatever this says, and the transient-5xx cooldown
# default (60s) exceeds max-retry-interval below, so with a single credential
# no failure class is ever retried. At 0 the loop is skipped entirely.
# CLIProxyAPI itself ships no default here.
request-retry: 3
max-retry-interval: 30
max-retry-credentials: 0

# stream-idle-timeout severs a streaming response that has gone this many
# seconds without a single chunk, handing the client an explicit timeout to
# retry against. Healthy streams are never quiet this long (the upstream emits
# SSE pings through thinking pauses); the streams this catches were dead flows
# that otherwise hung the client for 5-9 minutes. 0 = the 90s default,
# negative = off.
stream-idle-timeout: 0

# stream-early-flush commits "200, text/event-stream" for a streaming request
# that has produced no output after this many seconds, keeping the connection
# warm with SSE keep-alive comments until the upstream speaks. Exists for
# proxies fronted by Cloudflare, whose edge severs any response that shows no
# headers within ~100 seconds (a 524; the limit is fixed on free/Pro plans).
# Requests answered inside the threshold are untouched; one that fails after
# the preamble delivers its error as an in-stream SSE event instead of an
# HTTP status. 0 = the 30s default, negative = off.
stream-early-flush: 0

# claude-code-cache-ttl pins the lifetime of every prompt-cache breakpoint on
# requests from Claude Code (User-Agent claude-cli/*). Anthropic's cache lives
# 5 minutes by default, timed from the START of the request that last touched
# the prefix -- generation time counts -- so an agentic turn that runs past
# four minutes or so comes back to find the whole conversation evicted and
# writes it again at full price (18 full rewrites of a ~300k-token prefix in
# one morning, measured 2026-09-16). "1h" rewrites every breakpoint to the
# one-hour lifetime, "5m" forces the default, "" sends them as Claude Code
# wrote them. Every breakpoint rather than only the ones missing a ttl:
# Anthropic rejects a 1h breakpoint placed after a 5m one, and the engine
# flattens such a mix back to 5m. The trade: a 1h write bills at 2x the base
# input rate against 1.25x for 5m, so a client that never returns within five
# minutes pays the premium for nothing. Other clients are never touched.
claude-code-cache-ttl: ""

# Diagnostics.
#
# request-log writes full request AND response bodies to disk. Bodies are
# written verbatim, so anything secret carried in one is logged in the clear.
# Redaction applies to header and query names, and only to those containing
# authorization, api-key, apikey, token or secret -- Cookie is not on that
# list. Treat the log directory as secret material once you turn this on.
#
# Off means off, which took work: upstream forces a full dump on any 4xx or
# 5xx while this is disabled, so an unauthenticated request used to be enough
# to write a caller's whole prompt. slimproxy closes that path -- see
# gatedRequestLogger in proxy/requestlog.go.
#
# log-to-file is forced on when the full-screen panel runs (slimproxy on a
# terminal). The panel owns stdout, so a log line written there would land in
# the middle of a frame -- the lines are redirected rather than dropped, and
# `slimproxy check` reports the resulting path.
debug: false
request-log: false
log-to-file: false

# Interface language: "zh", "en", or empty to follow the system locale.
# Covers the panel, command output, diagnostics and error messages.
lang: ""

# Where file logs go when log-to-file is on (or forced on by panel mode).
# Empty means "logs" under the working directory.
log-dir: ""

# Where request-log bodies land. Empty means "<log-dir>/requests". The
# directory is only created while request-log is on; treat it as secret
# material -- see request-log above.
request-log-dir: ""

# How many days of the structured event stream to keep, under <log-dir>/events.
#
# One JSON object per completed request and per state change (proxy start,
# tunnel up/down, credential removed, doctor verdict), all on one timeline --
# which is what makes "why was that slow last Tuesday" answerable. Query it with
# "slimproxy log".
#
# Holds no request bodies and no headers, but it does name credentials and
# hostnames, so it is bounded rather than kept forever. Zero means 7.
journal-days: 7

# Optional model allowlist. Empty serves everything the loaded credentials
# expose. Matching is exact -- see proxy.Config.AllowModel before relying on it.
models: []
